---
- hosts: localhost
  gather_facts: false
  vars:
   limit_flavors: []
   limit_hosts: []
   dest_file: "/home/stack/overcloud_aci_report.tgz"

  tasks:
  - set_fact:
      sl: "{{ groups['overcloud_Controller'] + groups['Compute'] }}"
      remove_flavor_list: []
      exclude_host_list: []
      dest_file: "{{ dest_file }}"

  - name: Add hosts to controllers group
    ansible.builtin.add_host:
      name: "{{ item }}"
      groups: temp_controllers
    loop: "{{ groups['Controller'] | default([]) }}"
    when: (limit_hosts | length == 0) or (item in limit_hosts)

  - name: Add hosts to controllers group
    ansible.builtin.add_host:
      name: "{{ item }}"
      groups: temp_computes
    loop: "{{ groups['Compute'] | default([]) }}"
    when: (limit_hosts | length == 0) or (item in limit_hosts)

  - name: Copy hosts from temp_controller to controllers group
    add_host:
      name: "{{ item }}"
      groups: controllers
    loop: "{{ groups['temp_controllers'] }}"
    when: limit_flavors | length == 0 or 'controller' in limit_flavors

  - name: Copy hosts from temp_computes to computes group
    add_host:
      name: "{{ item }}"
      groups: computes
    loop: "{{ groups['temp_computes'] }}"
    when: limit_flavors | length == 0 or 'compute' in limit_flavors


  - name: create temp directory to collect data
    tempfile: 
     state: directory
     prefix: ciscoaci_
    register: tempdir
 
  - name: create ciscoaci subdir
    file:
      state: directory
      path: "{{ tempdir.path }}/overcloud"
    register: acidir

#  - name: Display hostnames and ansible_user for Compute nodes
#    debug:
#      msg: "Hostname: {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['ctlplane_hostname'] }}"
#    loop: "{{ groups['controllers'] }}"
#    when: "{{ 'controllers' in groups and groups['controllers'] | length > 0 }}"
#  - name: Display hostnames and ansible_user for Compute nodes
#    debug:
#      msg: "Hostname: {{ hostvars[item]['ansible_host'] }} {{ hostvars[item]['ctlplane_hostname'] }}"
#    loop: "{{ groups['computes'] }}"
#    when: "{{ 'computes' in groups and groups['computes'] | length > 0 }}"

- hosts: controllers, computes
  user: tripleo-admin
  gather_facts: false
  vars_files:
    - report_vars.yaml
  tasks:
    - name: Check known_hosts for {{ inventory_hostname }}
      local_action: shell ssh-keygen -F {{ inventory_hostname }}
      register: has_entry_in_known_hosts_file
      changed_when: false
      ignore_errors: yes
    - name: Ignore host key on first run
      when: has_entry_in_known_hosts_file == 1
      set_fact:
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    - name: create dir for this host under flavor
      file: 
        state: directory
        path: "{{ hostvars['localhost']['acidir']['path'] }}/{{ group_names[0] }}/{{ inventory_hostname }}"
      register: thisdir
      delegate_to: localhost

    - set_fact:
        mydir: "{{ thisdir.path }}"

    - name: create subdirs
      file: 
        state: directory
        path: "{{ mydir }}/{{ item }}"
        recurse: yes
      with_items:
        - system
        - ovs
        - neutron/config-data/puppet-generated
        - neutron_opflex/config-data/puppet-generated
        - nova/config-data/puppet-generated
        - opflex/config-data/puppet-generated
        - containers/config-data/puppet-generated
        - aim/config-data/puppet-generated
        - hieradata
        - network
      delegate_to: localhost

    - name: podman cmds
      shell: "podman exec -i {{ item.value.container }} {{ item.value.cmd }}"
      register: podman_output
      ignore_errors: true
      become: true
      with_dict: "{{ podman_cmds }}"

    - name: save podman cmds output
      copy:
        content: "{{ item.stdout }}"
        dest: "{{ mydir }}/{{ item.item.value.ofile }}"
      with_items: "{{ hostvars[inventory_hostname].podman_output.results }}"
      delegate_to: localhost
      no_log: True

    - name: exec commands
      shell: "{{ item.value.cmd }}"
      register: ctrl_output
      with_dict: "{{ commands }}"
      ignore_errors: true
      become: true
##
    - name: save exec outputs
      copy:
        content: "{{ item.stdout }}"
        dest: "{{ mydir }}/{{ item.item.value.ofile }}"
      with_items: "{{ hostvars[inventory_hostname].ctrl_output.results }}"
      delegate_to: localhost
      no_log: True

    - name: sync common directories
      synchronize:
        mode: pull
        src: "{{ item.value.rpath }}"
        dest: "{{ mydir }}/{{ item.value.lpath }}"
      become: true
      become_user: stack
      with_dict: "{{ rsync_dirs }}"
      delegate_to: localhost
      remote_user: tripleo-admin
      ignore_errors: true

    - name: sync controller directories
      synchronize:
        mode: pull
        src: "{{ item.value.rpath }}"
        dest: "{{ mydir }}/{{ item.value.lpath }}"
      become: true
      become_user: stack
      with_dict: "{{ rsync_controller_dirs }}"
      delegate_to: localhost
      remote_user: tripleo-admin
      ignore_errors: true
      when: group_names[0] == "Controller"

    - name: create archive
      shell: sudo tar -czvf "{{ hostvars['localhost']['dest_file'] }}" .
      args:
        chdir: "{{ hostvars['localhost']['tempdir']['path'] }}"
      #cannot use archive as it does not support ignoring missing links
      #archive: 
      #  path: "{{ hostvars['localhost']['tempdir']['path'] }}"
      #  dest: "{{ hostvars['localhost']['dest_file'] }}"
      delegate_to: localhost
      register: arch_status

    - name: remove the tmp dir
      file:
        path: "{{ hostvars['localhost']['tempdir']['path'] }}"
        state: absent
      when: arch_status.rc == 0
      delegate_to: localhost
      become: true
      ignore_errors: true

    - debug: msg="The archive file is at {{ hostvars['localhost']['dest_file'] }}"
